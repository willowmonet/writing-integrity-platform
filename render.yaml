services:
  - type: web
    name: writing-integrity-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://willowmonet.github.io
      - key: DB_NAME
        value: writing_integrity
      - key: MONGO_URL
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
